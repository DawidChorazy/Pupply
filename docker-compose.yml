services:
  postgres:
    image: postgres:16-alpine
    container_name: pupply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pupply
    ports:
      - "5432:5432"
    volumes:
      - pupply_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pupply"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pupply_postgres_data:
